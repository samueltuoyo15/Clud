<svg width="280" height="200" viewBox="0 0 280 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background subtle grid glow -->
  <circle cx="140" cy="100" r="85" fill="#401246" fill-opacity="0.04"/>
  <circle cx="140" cy="100" r="60" fill="#401246" fill-opacity="0.06"/>
  
  <!-- Base platform -->
  <ellipse cx="140" cy="160" rx="90" ry="16" fill="#F4F4F5"/>
  <ellipse cx="140" cy="157" rx="70" ry="11" fill="#E4E4E7"/>

  <!-- Server Tower Left -->
  <rect x="75" y="75" width="46" height="65" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="2"/>
  <rect x="83" y="85" width="30" height="4" rx="2" fill="#401246" fill-opacity="0.2"/>
  <rect x="83" y="95" width="20" height="4" rx="2" fill="#E4E4E7"/>
  <rect x="83" y="105" width="30" height="4" rx="2" fill="#E4E4E7"/>
  <circle cx="87" cy="123" r="2.5" fill="#10B981"/>
  <circle cx="95" cy="123" r="2.5" fill="#3B82F6"/>

  <!-- Server Tower Right -->
  <rect x="159" y="75" width="46" height="65" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="2"/>
  <rect x="167" y="85" width="30" height="4" rx="2" fill="#401246" fill-opacity="0.2"/>
  <rect x="167" y="95" width="24" height="4" rx="2" fill="#E4E4E7"/>
  <rect x="167" y="105" width="30" height="4" rx="2" fill="#E4E4E7"/>
  <circle cx="171" cy="123" r="2.5" fill="#10B981"/>
  <circle cx="179" cy="123" r="2.5" fill="#F59E0B"/>

  <!-- Central API Spec Document Floating -->
  <g transform="translate(112, 38)">
    <rect x="0" y="0" width="56" height="74" rx="10" fill="#FFFFFF" stroke="#401246" stroke-width="2.5" filter="drop-shadow(0 8px 16px rgba(64,18,70,0.12))"/>
    
    <!-- Code lines -->
    <rect x="10" y="14" width="22" height="4" rx="2" fill="#401246"/>
    <rect x="10" y="24" width="36" height="3" rx="1.5" fill="#D4D4D8"/>
    <rect x="10" y="32" width="28" height="3" rx="1.5" fill="#D4D4D8"/>
    <rect x="10" y="40" width="32" height="3" rx="1.5" fill="#D4D4D8"/>
    <rect x="10" y="48" width="18" height="3" rx="1.5" fill="#A1A1AA"/>

    <!-- Sparkle Badge -->
    <circle cx="46" cy="12" r="7" fill="#401246"/>
    <path d="M46 8V16M42 12H50" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Connecting dashed sync lines -->
  <path d="M121 110H159" stroke="#401246" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
  <circle cx="140" cy="110" r="4" fill="#401246"/>
  <circle cx="140" cy="110" r="8" stroke="#401246" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Floating particles -->
  <circle cx="60" cy="60" r="3" fill="#401246" fill-opacity="0.3"/>
  <circle cx="218" cy="50" r="4" fill="#401246" fill-opacity="0.2"/>
  <circle cx="225" cy="115" r="2.5" fill="#401246" fill-opacity="0.4"/>
  <circle cx="55" cy="125" r="3.5" fill="#401246" fill-opacity="0.2"/>
</svg>
